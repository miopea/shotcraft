name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned, not ubuntu-latest: that moved to Ubuntu 26.04, and the
    # lockfile's Playwright (1.59.1) refuses it ("Playwright does not support
    # chromium on ubuntu26.04-x64"), so the job died before any test ran.
    # Unpin once the lockfile's Playwright supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        # Snapshot tests in core + every template launch a real Chromium.
        # `pnpm install` doesn't trigger Playwright's browser download
        # because the install hook isn't on `allowBuilds`. Run via the
        # workspace package that actually depends on playwright (the
        # root has no `playwright` dep, so plain `pnpm exec` errors with
        # "Command playwright not found").
        run: pnpm --filter @shotcraft/web exec playwright install --with-deps chromium
      # `pnpm build` first because `examples/budgetbug` typechecks
      # against shotcraft's built typings (dist/), and template packages
      # build to dist/ that downstream consumers reference. If we
      # typecheck before build, those imports resolve to "Cannot find
      # module 'shotcraft'".
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        # INJECTED FAILURE (temporary, reverted in the next commit): point
        # Playwright at an empty browser dir so every test that launches
        # Chromium must fail. Proves the suite gates on the browser rather
        # than skipping when it is missing.
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/injected-no-browsers
